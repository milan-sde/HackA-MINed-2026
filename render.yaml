services:
  - type: web
    name: smartcontainer-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_PATH
        value: "/var/data/database.db"

  - type: web
    name: smartcontainer-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartcontainer-backend.onrender.com